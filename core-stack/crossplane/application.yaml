apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
spec:
  project: crossplane
  source:
    repoURL: https://github.com/Davitron/demo-platform-crossplane.git
    targetRevision: refs/heads/genesis
    path: charts
    helm:      
      valueFiles:
        - $values/.platform/mgnt.yaml
  destination:
    name: in-cluster
    namespace: crossplane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m


