apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
spec:
  project: crossplane
  sources:
    - repoURL: https://charts.crossplane.io/stable
      chart: crossplane
      targetRevision: v2.1.4
      helm:      
        valueFiles:
          - $values/.platform/mgnt.yaml
    - repoURL: https://github.com/Davitron/demo-platform-crossplane.git
      targetRevision: refs/heads/genesis
      ref: values
  destination:
    name: in-cluster
    namespace: crossplane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
