apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crossplane
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Crossplane project
  sourceRepos:
    - '*'
  destinations:
    - namespace: crossplane
      server: https://kubernetes.default.svc
      name: in-cluster
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  roles: []
